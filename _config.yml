title: AIOEH
description: 생각과 배움을 차곡차곡 남기는 블로그.
lang: ko-KR
timezone: Asia/Seoul
url: "https://tonynobleham.github.io"
baseurl: "/AIOEH.github.io"
permalink: /posts/:title/
markdown: kramdown
highlighter: rouge
