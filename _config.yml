title: AIOEH
description: MSDS 분석 서비스와 블로그를 연결하는 AIOEH.
lang: ko-KR
timezone: Asia/Seoul
url: "https://tonynobleham.github.io"
baseurl: "/AIOEH.github.io"
permalink: /blog/posts/:title/
markdown: kramdown
highlighter: rouge
excerpt_separator: "<!--more-->"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: /blog/feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
